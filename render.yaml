services:
  # 1. WeGive Backend Service (Express + WebSockets + PostgreSQL)
  - type: web
    name: wegive-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: postgresql://wegive_user:pMjxv0ve9GbPi6yMpCDFR2V39z91nHbl@dpg-d9n1of942hec73enso90-a/wegive
      - key: JWT_SECRET
        value: supersecret_wegive_jwt_key_2026
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: lakshayb057@gmail.com
      - key: SMTP_PASS
        value: angzefnwaziwmlzz
      - key: AWS_REGION
        value: ap-south-1

  # 2. WeGive Frontend App
  - type: web
    name: wegive-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l 3000
    envVars:
      - key: NODE_ENV
        value: production

  # 3. NGO Landing Page
  - type: web
    name: wegive-ngo-landing
    env: node
    region: oregon
    plan: free
    rootDir: finmantra-landing
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 8000
